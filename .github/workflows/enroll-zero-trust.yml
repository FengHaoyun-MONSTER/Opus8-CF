name: enroll-zero-trust

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Zero Trust operation
        required: true
        default: enroll
        type: choice
        options:
          - enroll
          - diagnose
          - verify-routing
          - diagnose-edge
          - rollback-acc1-n1
          - canary-ws
          - canary-grpc
      edge_version:
        description: Existing acc1-n1 Worker version ID used only for rollback
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  enroll:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.SERVICES_IP }}
      VPS_SSH_USER: ${{ secrets.SERVICES_USER }}
      VPS_SSH_PASSWORD: ${{ secrets.SERVICES_CODE }}
      VPS_SSH_PORT: ${{ secrets.SERVICES_SSH_PORT }}
      SOCKS_USER: ${{ secrets.SOCKS_USER }}
      SOCKS_PASSWORD: ${{ secrets.SOCKS_PASSWORD }}
      CF_ZERO_TRUST_TEAM: ${{ secrets.CF_ZERO_TRUST_TEAM }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CONTROL_ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      NODE_HMAC_SECRET: ${{ secrets.NODE_HMAC_SECRET }}
      ROOT_DOMAIN_ACC1: ${{ secrets.ROOT_DOMAIN }}
      ROOT_DOMAIN_ACC2: ${{ secrets.ROOT_DOMAIN_NUM1 }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate and mask credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?SERVICES_IP is required}"
          : "${VPS_SSH_USER:?SERVICES_USER is required}"
          : "${VPS_SSH_PASSWORD:?SERVICES_CODE is required}"
          : "${SOCKS_USER:?SOCKS_USER is required}"
          : "${SOCKS_PASSWORD:?SOCKS_PASSWORD is required}"
          : "${CF_ZERO_TRUST_TEAM:?CF_ZERO_TRUST_TEAM is required}"
          : "${CF_ACCESS_CLIENT_ID:?CF_ACCESS_CLIENT_ID is required}"
          : "${CF_ACCESS_CLIENT_SECRET:?CF_ACCESS_CLIENT_SECRET is required}"
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_SSH_USER"
          echo "::add-mask::$VPS_SSH_PASSWORD"
          echo "::add-mask::$SOCKS_USER"
          echo "::add-mask::$SOCKS_PASSWORD"
          echo "::add-mask::$CF_ACCESS_CLIENT_ID"
          echo "::add-mask::$CF_ACCESS_CLIENT_SECRET"
          echo "VPS_SSH_PORT=${VPS_SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Install SSH client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Build managed deployment profile
        if: inputs.operation == 'enroll'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > /tmp/opus8-mdm.xml <<EOF
          <dict>
            <key>auth_client_id</key>
            <string>${CF_ACCESS_CLIENT_ID}</string>
            <key>auth_client_secret</key>
            <string>${CF_ACCESS_CLIENT_SECRET}</string>
            <key>auto_connect</key>
            <integer>1</integer>
            <key>onboarding</key>
            <false/>
            <key>organization</key>
            <string>${CF_ZERO_TRUST_TEAM}</string>
            <key>service_mode</key>
            <string>proxy</string>
            <key>proxy_port</key>
            <integer>40000</integer>
            <key>warp_tunnel_protocol</key>
            <string>masque</string>
          </dict>
          EOF

      - name: Enroll VPS and preserve Local Proxy mode
        if: inputs.operation == 'enroll'
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$VPS_SSH_PASSWORD"
          SCP_OPTS=(
            -P "$VPS_SSH_PORT"
            -o ConnectTimeout=12
            -o StrictHostKeyChecking=accept-new
          )
          SSH_OPTS=(
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=12
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
          )

          sshpass -e scp "${SCP_OPTS[@]}" /tmp/opus8-mdm.xml \
            infra/scripts/enroll-zero-trust.sh "$VPS_SSH_USER@$VPS_HOST:/tmp/"
          TEAM_B64=$(printf '%s' "$CF_ZERO_TRUST_TEAM" | base64 -w0)
          sshpass -e ssh "${SSH_OPTS[@]}" "$VPS_SSH_USER@$VPS_HOST" \
            "CF_ZERO_TRUST_TEAM=\$(printf '%s' '$TEAM_B64' | base64 -d) bash /tmp/enroll-zero-trust.sh"

      - name: Verify production Dante to managed WARP
        if: inputs.operation == 'enroll'
        shell: bash
        run: |
          set -euo pipefail
          EXIT_IP=$(curl -4fsS --max-time 30 \
            --proxy "socks5h://${VPS_HOST}:40008" \
            --proxy-user "${SOCKS_USER}:${SOCKS_PASSWORD}" \
            https://api.ipify.org)
          test -n "$EXIT_IP"
          if curl -4fsS --max-time 8 \
            --proxy "socks5h://${VPS_HOST}:40008" \
            https://api.ipify.org >/dev/null 2>&1; then
            echo "::error::Dante unexpectedly permits unauthenticated access"
            exit 1
          fi
          echo "OK managed-warp-through-authenticated-dante"

      - name: Verify four edge routing paths
        if: inputs.operation == 'enroll' || inputs.operation == 'verify-routing'
        shell: bash
        run: |
          set -euo pipefail
          : "${CONTROL_ROOT_DOMAIN:?ROOT_DOMAIN is required}"
          : "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
          : "${NODE_HMAC_SECRET:?NODE_HMAC_SECRET is required}"
          : "${ROOT_DOMAIN_ACC1:?ROOT_DOMAIN is required}"
          : "${ROOT_DOMAIN_ACC2:?ROOT_DOMAIN_NUM1 is required}"

          normalize_domain() {
            local domain="${1#https://}"
            domain="${domain#http://}"
            printf '%s' "${domain%%/*}"
          }

          CONTROL_ROOT_DOMAIN="$(normalize_domain "$CONTROL_ROOT_DOMAIN")"
          ROOT_DOMAIN_ACC1="$(normalize_domain "$ROOT_DOMAIN_ACC1")"
          ROOT_DOMAIN_ACC2="$(normalize_domain "$ROOT_DOMAIN_ACC2")"
          CONTROL_API="https://api.${CONTROL_ROOT_DOMAIN}"
          nodes=(
            "acc1-n1|acc1-n1.${ROOT_DOMAIN_ACC1}"
            "acc1-n2|acc1-n2.${ROOT_DOMAIN_ACC1}"
            "acc2-n1|acc2-n1.${ROOT_DOMAIN_ACC2}"
            "acc2-n2|acc2-n2.${ROOT_DOMAIN_ACC2}"
          )
          VERIFY_UUID=""
          BEFORE_CONNECTIONS=0
          BEFORE_BYTES=0

          smoke_with_retry() {
            local label="$1"
            local script="$2"
            shift 2
            for attempt in 1 2 3 4; do
              if python3 "$script" "$@"; then
                echo "OK $label"
                return 0
              fi
              sleep 5
            done
            echo "::error::$label failed after four attempts"
            return 1
          }

          for entry in "${nodes[@]}"; do
            IFS='|' read -r node host <<<"$entry"
            timestamp="$(date +%s)000"
            signature="$(printf '%s' "${timestamp}.${node}." \
              | openssl dgst -sha256 -hmac "$NODE_HMAC_SECRET" -r \
              | cut -d' ' -f1)"
            uuid="$(curl -fsS --max-time 20 \
              "$CONTROL_API/api/nodes/$node/uuids" \
              -H "x-opus8-ts: $timestamp" \
              -H "x-opus8-node: $node" \
              -H "x-opus8-sign: $signature" \
              | jq -er '.uuids[0]')"
            if [ -z "$VERIFY_UUID" ]; then
              VERIFY_UUID="$uuid"
              login_body="$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')"
              admin_token="$(curl -fsS --max-time 20 -X POST \
                "$CONTROL_API/api/admin/login" \
                -H 'content-type: application/json' \
                --data "$login_body" | jq -er '.token')"
              before_user="$(curl -fsS --max-time 20 "$CONTROL_API/api/users" \
                -H "authorization: Bearer $admin_token" \
                | jq -cer --arg uuid "$VERIFY_UUID" '.users[] | select(.uuid == $uuid)')"
              BEFORE_CONNECTIONS="$(printf '%s' "$before_user" | jq -er '.connections')"
              BEFORE_BYTES="$(printf '%s' "$before_user" | jq -er '.bytes_up + .bytes_down')"
            elif [ "$uuid" != "$VERIFY_UUID" ]; then
              echo "::error::Nodes returned inconsistent first active UUIDs"
              exit 1
            fi

            smoke_with_retry "$node direct-cf-egress" \
              infra/scripts/smoke-vless.py \
              --url "wss://${host}/?ed=2560" \
              --uuid "$uuid" \
              --target example.com \
              --target-port 80 \
              --expect-status 0
            smoke_with_retry "$node ai-landing-warp-egress" \
              infra/scripts/smoke-vless.py \
              --url "wss://${host}/?ed=2560" \
              --uuid "$uuid" \
              --target openai.com \
              --target-port 80 \
              --expect-status 0
          done

          sleep 5
          usage_users="$(curl -fsS --max-time 20 "$CONTROL_API/api/users" \
            -H "authorization: Bearer $admin_token")"
          after_user="$(printf '%s' "$usage_users" \
            | jq -cer --arg uuid "$VERIFY_UUID" '.users[] | select(.uuid == $uuid)')"
          AFTER_CONNECTIONS="$(printf '%s' "$after_user" | jq -er '.connections')"
          AFTER_BYTES="$(printf '%s' "$after_user" | jq -er '.bytes_up + .bytes_down')"
          CONNECTION_DELTA=$((AFTER_CONNECTIONS - BEFORE_CONNECTIONS))
          BYTE_DELTA=$((AFTER_BYTES - BEFORE_BYTES))
          if [ "$CONNECTION_DELTA" -ge 8 ] && [ "$BYTE_DELTA" -gt 0 ]; then
            echo "OK edge-usage-accounting connections=$CONNECTION_DELTA"
          else
            echo "::error::Expected at least 8 metered WebSocket connections; got $CONNECTION_DELTA"
            exit 1
          fi

      - name: Canary account-1 VLESS transport with an isolated user
        if: inputs.operation == 'canary-grpc' || inputs.operation == 'canary-ws'
        shell: bash
        run: |
          set -euo pipefail
          : "${CONTROL_ROOT_DOMAIN:?ROOT_DOMAIN is required}"
          : "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
          : "${NODE_HMAC_SECRET:?NODE_HMAC_SECRET is required}"
          : "${ROOT_DOMAIN_ACC1:?ROOT_DOMAIN is required}"

          normalize_domain() {
            local domain="${1#https://}"
            domain="${domain#http://}"
            printf '%s' "${domain%%/*}"
          }

          CONTROL_ROOT_DOMAIN="$(normalize_domain "$CONTROL_ROOT_DOMAIN")"
          ROOT_DOMAIN_ACC1="$(normalize_domain "$ROOT_DOMAIN_ACC1")"
          CONTROL_API="https://api.${CONTROL_ROOT_DOMAIN}"
          NODE_ID="acc1-n1"
          NODE_HOST="acc1-n1.${ROOT_DOMAIN_ACC1}"

          login_body="$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')"
          admin_token="$(curl -fsS --max-time 20 -X POST \
            "$CONTROL_API/api/admin/login" \
            -H 'content-type: application/json' \
            --data "$login_body" | jq -er '.token')"
          echo "::add-mask::$admin_token"

          canary_user_id=""
          cleanup_canary_user() {
            if [ -n "$canary_user_id" ]; then
              curl -fsS --max-time 20 -X DELETE \
                "$CONTROL_API/api/users/$canary_user_id" \
                -H "authorization: Bearer $admin_token" >/dev/null || true
            fi
          }
          trap cleanup_canary_user EXIT

          create_body="$(jq -nc \
            --arg username "opus8-grpc-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '{
              username:$username,
              nodeGroup:["acc1-n1"],
              unlock:false,
              durationDays:1,
              deviceLimit:4,
              ipLimit24h:10,
              trafficLimitBytes:0
            }')"
          canary_user="$(curl -fsS --max-time 20 -X POST \
            "$CONTROL_API/api/users" \
            -H "authorization: Bearer $admin_token" \
            -H 'content-type: application/json' \
            --data "$create_body")"
          canary_user_id="$(printf '%s' "$canary_user" | jq -er '.user.id')"
          uuid="$(printf '%s' "$canary_user" | jq -er '.user.uuid')"
          echo "::add-mask::$canary_user_id"
          echo "::add-mask::$uuid"
          echo "INFO waiting-for-edge-policy-cache"
          sleep 65

          before_user="$(curl -fsS --max-time 20 "$CONTROL_API/api/users" \
            -H "authorization: Bearer $admin_token" \
            | jq -cer --arg uuid "$uuid" '.users[] | select(.uuid == $uuid)')"
          before_connections="$(printf '%s' "$before_user" | jq -er '.connections')"
          before_bytes="$(printf '%s' "$before_user" | jq -er '.bytes_up + .bytes_down')"

          expected_connections=1
          if [ "${{ inputs.operation }}" = "canary-grpc" ]; then
            bash infra/scripts/smoke-vless-grpc-xray.sh "$NODE_HOST" "$uuid"
          else
            expected_connections=0
            ws_failed=0
            for ws_entry in \
              "acc1-n2-workers|opus8cf-node-acc1-n2.techtoolhub-office.workers.dev" \
              "acc1-n2-custom|acc1-n2.${ROOT_DOMAIN_ACC1}" \
              "acc1-n1-workers|opus8cf-node-acc1-n1.techtoolhub-office.workers.dev" \
              "acc1-n1-custom|acc1-n1.${ROOT_DOMAIN_ACC1}"; do
              IFS='|' read -r ws_label ws_host <<<"$ws_entry"
              route_ok=0
              for attempt in 1 2 3; do
                if python3 infra/scripts/smoke-vless.py \
                  --url "wss://${ws_host}/?ed=2560" \
                  --uuid "$uuid" \
                  --target example.com \
                  --target-port 80 \
                  --expect-status 0; then
                  route_ok=1
                  break
                fi
                sleep 2
              done
              if [ "$route_ok" -eq 1 ]; then
                expected_connections=$((expected_connections + 1))
                echo "OK vless-ws-egress route=$ws_label"
              else
                ws_failed=1
                echo "::error::vless-ws-egress failed route=$ws_label"
              fi
            done
            [ "$ws_failed" -eq 0 ] || exit 1
          fi

          after_connections="$before_connections"
          after_bytes="$before_bytes"
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            after_user="$(curl -fsS --max-time 20 "$CONTROL_API/api/users" \
              -H "authorization: Bearer $admin_token" \
              | jq -cer --arg uuid "$uuid" '.users[] | select(.uuid == $uuid)')"
            after_connections="$(printf '%s' "$after_user" | jq -er '.connections')"
            after_bytes="$(printf '%s' "$after_user" | jq -er '.bytes_up + .bytes_down')"
            if [ "$after_connections" -gt "$before_connections" ] \
              && [ "$after_bytes" -gt "$before_bytes" ]; then
              break
            fi
          done

          connection_delta=$((after_connections - before_connections))
          byte_delta=$((after_bytes - before_bytes))
          if [ "$connection_delta" -ge "$expected_connections" ] && [ "$byte_delta" -gt 0 ]; then
            echo "OK transport-usage-accounting connections=$connection_delta bytes=$byte_delta"
          else
            echo "::error::Transport connected but usage accounting did not increase; connections=$connection_delta bytes=$byte_delta"
            exit 1
          fi

      - name: Diagnose account-1 edge bindings
        if: inputs.operation == 'diagnose-edge'
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CF_API_TOKEN:?API_TOKEN is required}"
          : "${CF_ACCOUNT_ID:?ACCOUNT_ID is required}"
          echo "::add-mask::$CF_API_TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"

          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts"
          for node in acc1-n1 acc1-n2; do
            script="opus8cf-node-${node}"
            settings="$(curl -fsS --max-time 30 \
              -H "authorization: Bearer ${CF_API_TOKEN}" \
              "${api}/${script}/settings")"
            printf '%s' "$settings" | jq -cer --arg node "$node" '
              if .success != true then error("Cloudflare settings request failed")
              else {
                node:$node,
                compatibility_date:.result.compatibility_date,
                compatibility_flags:(.result.compatibility_flags // []),
                bindings:[
                  .result.bindings[]?
                  | {
                      name,
                      type,
                      namespace_id:(.namespace_id // null)
                    }
                ]
              } end'
            versions="$(curl -fsS --max-time 30 \
              -H "authorization: Bearer ${CF_API_TOKEN}" \
              "${api}/${script}/versions?per_page=40")"
            printf '%s' "$versions" | jq -cer --arg node "$node" '
              if .success != true then error("Cloudflare versions request failed")
              else {
                node:$node,
                versions:[
                  .result.items[]?
                  | {
                      id,
                      number,
                      created_on:.metadata.created_on,
                      source:.metadata.source
                    }
                ]
              } end'
          done

      - name: Roll back account-1 node 1
        if: inputs.operation == 'rollback-acc1-n1'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          EDGE_VERSION: ${{ inputs.edge_version }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?ACCOUNT_ID is required}"
          : "${EDGE_VERSION:?edge_version is required}"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 rollback "$EDGE_VERSION" \
            --name opus8cf-node-acc1-n1 \
            --message "Restore validated Opus8 transport runtime"

      - name: Diagnose recent Zero Trust enrollment
        if: inputs.operation == 'diagnose'
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$VPS_SSH_PASSWORD"
          sshpass -e ssh -p "$VPS_SSH_PORT" \
            -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_SSH_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "DIAG status_begin"
          warp-cli --accept-tos status 2>&1 || true
          echo "DIAG settings_begin"
          warp-cli --accept-tos settings 2>&1 \
            | sed -E 's/[A-Za-z0-9._-]{24,}/<redacted>/g' || true
          echo "DIAG registration_begin"
          warp-cli --accept-tos registration show 2>&1 \
            | sed -E 's/[A-Za-z0-9._@-]{24,}/<redacted>/g' || true
          echo "DIAG journal_begin"
          journalctl -u warp-svc.service --since '30 minutes ago' --no-pager 2>&1 \
            | grep -Ei 'registration|enroll|auth|token|organization|team|mdm|error|failed|denied|forbidden' \
            | sed -E 's/[A-Za-z0-9._@:/?&=%-]{24,}/<redacted>/g' \
            | tail -n 120 || true
          echo "DIAG journal_end"
          REMOTE
