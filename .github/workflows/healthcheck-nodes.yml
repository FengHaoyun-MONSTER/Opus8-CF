name: healthcheck-nodes

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: healthcheck-nodes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      HEALTH_ALERT_FILE: ${{ runner.temp }}/opus8-health-state.json
    steps:
      - uses: actions/checkout@v4
      - name: Probe every enabled node
        id: probe
        run: bash infra/scripts/healthcheck-nodes.sh
      - name: Publish health alerts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEALTHCHECK_OUTCOME: ${{ steps.probe.outcome }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: bash infra/scripts/publish-health-alert.sh
