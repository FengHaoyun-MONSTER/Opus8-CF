name: healthcheck-nodes

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: healthcheck-nodes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      VPS_HOST: ${{ secrets.SERVICES_IP }}
      VPS_SSH_USER: ${{ secrets.SERVICES_USER }}
      VPS_SSH_PASSWORD: ${{ secrets.SERVICES_CODE }}
      VPS_SSH_PORT: ${{ secrets.SERVICES_SSH_PORT }}
      HEALTH_ALERT_FILE: /tmp/opus8-health-state.json
      CLOUDFLARE_PROXY_PERMISSION_REF: ${{ secrets.CLOUDFLARE_PROXY_PERMISSION_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check data-plane authorization
        id: compliance
        shell: bash
        run: |
          set +e
          node infra/scripts/compliance-gate.mjs \
            --mode data-plane-test --all-current-nodes
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "allowed=1" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ]; then
            echo "allowed=0" >> "$GITHUB_OUTPUT"
            echo "## Health check skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Documented Cloudflare authorization has not passed the fail-closed gate." >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$code"
          fi
      - name: Prepare landing-vantage SSH
        if: steps.compliance.outputs.allowed == '1'
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${VPS_HOST:-}"
          echo "::add-mask::${VPS_SSH_USER:-}"
          echo "::add-mask::${VPS_SSH_PASSWORD:-}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Probe every enabled node
        if: steps.compliance.outputs.allowed == '1'
        id: probe
        run: bash infra/scripts/healthcheck-nodes.sh
      - name: Publish health alerts
        if: always() && steps.compliance.outputs.allowed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEALTHCHECK_OUTCOME: ${{ steps.probe.outcome }}
        run: bash infra/scripts/publish-health-alert.sh
