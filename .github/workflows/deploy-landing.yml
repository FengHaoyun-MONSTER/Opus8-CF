name: deploy-landing

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Landing host operation
        required: true
        default: audit
        type: choice
        options:
          - audit
          - deploy-dante
          - deploy-all

permissions:
  contents: read

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  landing:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.SERVICES_IP }}
      VPS_SSH_USER: ${{ secrets.SERVICES_USER }}
      VPS_SSH_PASSWORD: ${{ secrets.SERVICES_CODE }}
      VPS_SSH_PORT: ${{ secrets.SERVICES_SSH_PORT }}
      SOCKS_USER: ${{ secrets.SOCKS_USER }}
      SOCKS_PASSWORD: ${{ secrets.SOCKS_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
      CONTROL_ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?SERVICES_IP is required}"
          : "${VPS_SSH_USER:?SERVICES_USER is required}"
          : "${VPS_SSH_PASSWORD:?SERVICES_CODE is required}"
          : "${SOCKS_USER:?SOCKS_USER is required}"
          : "${SOCKS_PASSWORD:?SOCKS_PASSWORD is required}"
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_SSH_USER"
          echo "::add-mask::$VPS_SSH_PASSWORD"
          echo "::add-mask::$SOCKS_USER"
          echo "::add-mask::$SOCKS_PASSWORD"
          echo "VPS_SSH_PORT=${VPS_SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Install SSH client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Audit landing host
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$VPS_SSH_PASSWORD"
          SSH=(sshpass -e ssh
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=12
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
            "$VPS_SSH_USER@$VPS_HOST")

          "${SSH[@]}" 'bash -s' <<'REMOTE' | tee /tmp/landing-audit.log
          set -u
          echo "AUDIT ssh=ok"
          echo "AUDIT os=$(awk -F= '/^ID=/{gsub(/"/,"",$2); print $2; exit}' /etc/os-release 2>/dev/null || echo unknown)"
          echo "AUDIT version=$(awk -F= '/^VERSION_ID=/{gsub(/"/,"",$2); print $2; exit}' /etc/os-release 2>/dev/null || echo unknown)"
          echo "AUDIT arch=$(uname -m)"
          echo "AUDIT uid=$(id -u)"
          if [ "$(id -u)" -eq 0 ]; then
            echo "AUDIT privilege=root"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo "AUDIT privilege=passwordless-sudo"
          elif command -v sudo >/dev/null 2>&1; then
            echo "AUDIT privilege=sudo-password-required"
          else
            echo "AUDIT privilege=no-sudo"
          fi
          echo "AUDIT default_interface=$(ip -o route show default 2>/dev/null | awk 'NR==1{print $5}')"
          if command -v docker >/dev/null 2>&1; then
            echo "AUDIT docker=installed"
          else
            echo "AUDIT docker=absent"
          fi
          if systemctl list-unit-files 2>/dev/null | grep -Eq '(^|@)x-ui|x-ui\.service'; then
            echo "AUDIT xui=installed"
          else
            echo "AUDIT xui=not-detected"
          fi
          for port in 22 40000 40008 40009; do
            if ss -H -lnt 2>/dev/null | awk '{print $4}' | grep -Eq "(^|:)$port$"; then
              echo "AUDIT port_${port}=occupied"
            else
              echo "AUDIT port_${port}=free"
            fi
          done
          if command -v warp-cli >/dev/null 2>&1; then
            echo "AUDIT warp=installed"
          else
            echo "AUDIT warp=absent"
          fi
          if command -v sockd >/dev/null 2>&1 || command -v danted >/dev/null 2>&1; then
            echo "AUDIT dante=installed"
            echo "DETAIL dante_journal_begin"
            journalctl -u opus8-dante.service --no-pager -n 40 2>/dev/null || true
            echo "DETAIL dante_journal_end"
          else
            echo "AUDIT dante=absent"
          fi
          echo "DETAIL listeners_begin"
          ss -H -lntup 2>/dev/null | awk '$5 ~ /:(40000|40008|40009)$/ {print}' || true
          echo "DETAIL listeners_end"
          SOCAT_PID=$(ss -H -lntup 2>/dev/null \
            | awk '$5 ~ /:40008$/ && $0 ~ /socat/ {match($0,/pid=[0-9]+/); if (RSTART) print substr($0,RSTART+4,RLENGTH-4)}' \
            | head -n1)
          if [ -n "$SOCAT_PID" ] && [ -r "/proc/$SOCAT_PID/cmdline" ]; then
            echo "DETAIL socat_begin"
            printf 'pid=%s ppid=%s command=' "$SOCAT_PID" "$(awk '/^PPid:/{print $2}' "/proc/$SOCAT_PID/status")"
            tr '\0' ' ' < "/proc/$SOCAT_PID/cmdline"
            echo
            echo "cgroup=$(tr '\n' ';' < "/proc/$SOCAT_PID/cgroup")"
            echo "DETAIL socat_end"
          fi
          echo "DETAIL services_begin"
          systemctl --no-pager --plain --type=service --state=running 2>/dev/null \
            | grep -Ei 'warp|x-ui|xray|sing-box|sock|dante|gost' || true
          echo "DETAIL services_end"
          if command -v docker >/dev/null 2>&1; then
            echo "DETAIL docker_begin"
            docker ps --format '{{.Names}}|{{.Image}}|{{.Ports}}' 2>/dev/null || true
            echo "DETAIL docker_end"
          fi
          if command -v warp-cli >/dev/null 2>&1; then
            echo "DETAIL warp_status_begin"
            timeout 10 warp-cli --accept-tos status 2>&1 || true
            timeout 10 warp-cli --accept-tos settings 2>&1 \
              | sed -E 's/(organization|team|account|license)[^:]*:.*/\1: <configured>/I' || true
            echo "DETAIL warp_status_end"
            DIRECT_IP=$(curl -4fsS --max-time 10 https://api.ipify.org 2>/dev/null || true)
            WARP_IP=$(curl -4fsS --max-time 15 --proxy socks5h://127.0.0.1:40000 \
              https://api.ipify.org 2>/dev/null || true)
            if [ -n "$DIRECT_IP" ]; then echo "AUDIT direct_egress=ok"; else echo "AUDIT direct_egress=failed"; fi
            if [ -n "$WARP_IP" ]; then echo "AUDIT warp_proxy_egress=ok"; else echo "AUDIT warp_proxy_egress=failed"; fi
            if [ -n "$DIRECT_IP" ] && [ -n "$WARP_IP" ] && [ "$DIRECT_IP" != "$WARP_IP" ]; then
              echo "AUDIT warp_exit=changed"
            elif [ -n "$DIRECT_IP" ] && [ -n "$WARP_IP" ]; then
              echo "AUDIT warp_exit=unchanged"
            fi
          fi
          REMOTE

          {
            echo "## Landing host audit"
            echo '```text'
            grep '^AUDIT ' /tmp/landing-audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe Cloudflare Zero Trust API
        if: inputs.operation == 'audit' || inputs.operation == 'deploy-all'
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?ACCOUNT_ID is required}"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          probe() {
            local path="$1" label="$2" code
            code=$(curl -sS -o "/tmp/$label.json" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api/$path")
            echo "PROBE $label=http_$code"
          }

          probe "access/organizations" "organization"
          probe "access/apps?per_page=100" "access_apps"
          probe "access/service_tokens?per_page=100" "service_tokens"
          probe "devices/policies" "device_profiles"

          {
            echo "## Cloudflare Zero Trust API audit"
            echo '```text'
            probe "access/organizations" "organization_summary"
            probe "access/apps?per_page=100" "access_apps_summary"
            probe "access/service_tokens?per_page=100" "service_tokens_summary"
            probe "devices/policies" "device_profiles_summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy authenticated Dante to WARP
        if: inputs.operation != 'audit'
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$VPS_SSH_PASSWORD"
          SSH_BASE=(
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=12
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
          )
          umask 077
          {
            printf 'SOCKS_USER_B64=%s\n' "$(printf '%s' "$SOCKS_USER" | base64 -w0)"
            printf 'SOCKS_PASSWORD_B64=%s\n' "$(printf '%s' "$SOCKS_PASSWORD" | base64 -w0)"
          } > /tmp/opus8-landing.env

          sshpass -e scp -P "$VPS_SSH_PORT" \
            -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=accept-new \
            /tmp/opus8-landing.env "$VPS_SSH_USER@$VPS_HOST:/tmp/"
          sshpass -e scp -P "$VPS_SSH_PORT" \
            -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=accept-new \
            infra/scripts/deploy-landing.sh "$VPS_SSH_USER@$VPS_HOST:/tmp/"
          sshpass -e ssh "${SSH_BASE[@]}" "$VPS_SSH_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          source /tmp/opus8-landing.env
          export SOCKS_USER="$(printf '%s' "$SOCKS_USER_B64" | base64 -d)"
          export SOCKS_PASSWORD="$(printf '%s' "$SOCKS_PASSWORD_B64" | base64 -d)"
          rm -f /tmp/opus8-landing.env
          chmod 0700 /tmp/deploy-landing.sh
          if [ "$(id -u)" -eq 0 ]; then
            /tmp/deploy-landing.sh
          else
            sudo --preserve-env=SOCKS_USER,SOCKS_PASSWORD /tmp/deploy-landing.sh
          fi
          rm -f /tmp/deploy-landing.sh
          REMOTE

      - name: Verify public SOCKS5 authentication
        if: inputs.operation != 'audit'
        shell: bash
        run: |
          set -euo pipefail
          AUTH_EXIT=$(curl -4fsS --max-time 25 \
            --proxy "socks5h://${VPS_HOST}:40008" \
            --proxy-user "${SOCKS_USER}:${SOCKS_PASSWORD}" \
            https://api.ipify.org)
          test -n "$AUTH_EXIT"
          if curl -4fsS --max-time 8 --proxy "socks5h://${VPS_HOST}:40008" \
            https://api.ipify.org >/dev/null 2>&1; then
            echo "::error::Public SOCKS5 still permits unauthenticated access"
            exit 1
          fi
          echo "OK public-authenticated-socks5"

      - name: Rotate control-plane landing credentials
        if: inputs.operation != 'audit'
        shell: bash
        run: |
          set -euo pipefail
          : "${CONTROL_ROOT_DOMAIN:?ROOT_DOMAIN is required}"
          : "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
          root="${CONTROL_ROOT_DOMAIN#https://}"
          root="${root#http://}"
          root="${root%%/*}"
          api="https://api.${root}"

          LOGIN=$(curl -fsS --max-time 20 -X POST "$api/api/admin/login" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')")
          TOKEN=$(printf '%s' "$LOGIN" | jq -er '.token')
          LANDINGS=$(curl -fsS --max-time 20 "$api/api/landings" \
            -H "authorization: Bearer $TOKEN")
          mapfile -t IDS < <(printf '%s' "$LANDINGS" | jq -r \
            --arg host "$VPS_HOST" '.landings[] | select(.hostname == $host and .port == 40008) | .id')
          if [ "${#IDS[@]}" -eq 0 ]; then
            echo "::error::No control-plane landing matches SERVICES_IP:40008"
            exit 1
          fi

          PAYLOAD=$(jq -nc --arg username "$SOCKS_USER" --arg password "$SOCKS_PASSWORD" \
            '{username:$username,password:$password}')
          for id in "${IDS[@]}"; do
            curl -fsS --max-time 20 -X PATCH "$api/api/landings/$id" \
              -H "authorization: Bearer $TOKEN" \
              -H 'content-type: application/json' \
              --data "$PAYLOAD" >/dev/null
            TEST_CODE=$(curl -sS --max-time 30 -o /tmp/landing-test.json -w '%{http_code}' \
              -X POST "$api/api/landings/$id/test" \
              -H "authorization: Bearer $TOKEN" || true)
            if [ "$TEST_CODE" = "200" ] && jq -e '.ok == true' /tmp/landing-test.json >/dev/null 2>&1; then
              echo "OK control-plane-landing-test id=$id"
            else
              TEST_ERROR=$(jq -r '.error // "unknown test error"' /tmp/landing-test.json 2>/dev/null || echo "unknown test error")
              echo "::warning::Control-plane test returned HTTP $TEST_CODE: $TEST_ERROR"
            fi
          done
          echo "OK control-plane-credentials-rotated count=${#IDS[@]}"

      - name: Wait for edge policy refresh
        if: inputs.operation != 'audit'
        shell: bash
        run: |
          echo "Waiting 70 seconds for the four edge nodes to refresh their encrypted landing bundle."
          sleep 70
          echo "OK edge-refresh-window-complete"

      - name: Restore legacy forwarder if deployment fails
        if: failure() && inputs.operation != 'audit'
        shell: bash
        run: |
          set +e
          export SSHPASS="$VPS_SSH_PASSWORD"
          sshpass -e ssh -p "$VPS_SSH_PORT" \
            -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_SSH_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +e
          systemctl disable --now opus8-dante.service >/dev/null 2>&1
          if ! ss -H -lnt 2>/dev/null | awk '{print $4}' | grep -Eq '(^|:)40008$'; then
            cat > /etc/systemd/system/opus8-legacy-socat.service <<'EOF'
          [Unit]
          Description=Opus8 legacy WARP SOCKS forwarder
          After=network-online.target warp-svc.service
          Requires=warp-svc.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/socat TCP-LISTEN:40008,bind=0.0.0.0,fork TCP:127.0.0.1:40000
          Restart=always
          RestartSec=2s

          [Install]
          WantedBy=multi-user.target
          EOF
            systemctl daemon-reload
            systemctl enable --now opus8-legacy-socat.service
          fi
          REMOTE
          echo "::warning::Deployment failed; attempted to restore the previous socat forwarder."
