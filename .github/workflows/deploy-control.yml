name: deploy-control

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-control.yml'
      - 'infra/scripts/deploy-control.sh'
      - 'infra/scripts/compliance-gate.mjs'
      - 'infra/compliance-policy.json'
      - 'infra/scripts/configure-subscription-waf.sh'
      - 'infra/ai-unlock.txt'
      - 'infra/transport-mode.txt'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/control-plane/**'
      - 'packages/shared/**'

permissions:
  contents: write

concurrency:
  group: deploy-control
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NODE_HMAC_SECRET: ${{ secrets.NODE_HMAC_SECRET }}
      LANDING_CONFIG_KEY: ${{ secrets.LANDING_CONFIG_KEY }}
      ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      ADMIN_UI_ORIGINS: https://opus8cf-admin-openal.pages.dev
      SERVICES_IP: ${{ secrets.SERVICES_IP }}
      SERVICES_USER: ${{ secrets.SOCKS_USER }}
      SERVICES_CODE: ${{ secrets.SOCKS_PASSWORD }}
      CLOUDFLARE_PROXY_PERMISSION_REF: ${{ secrets.CLOUDFLARE_PROXY_PERMISSION_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Deploy control-plane
        id: deploy
        run: |
          set -euo pipefail
          {
            corepack enable
            pnpm install --frozen-lockfile
            npm i -g wrangler@4.115.0 esbuild
            bash infra/scripts/deploy-control.sh
          } 2>&1 | tee /tmp/dc.log

      - name: Publish status back to repo
        if: always()
        run: |
          mkdir -p infra/status
          URL=$(grep '^DONE url=' /tmp/dc.log | tail -n1 | sed 's/^DONE url=//' || true)
          MARKERS=$(grep -E '^(STEP|OK|ERROR|DONE) ' /tmp/dc.log || true)
          # 失败时保留最后几行日志（抹掉任何 24+ 位的长串，避免泄露 token/id）
          TAIL=$(tail -n 12 /tmp/dc.log | sed 's/[A-Za-z0-9_-]\{24,\}/<redacted>/g' || true)
          jq -n \
            --arg r "${{ steps.deploy.outcome }}" \
            --arg u "$URL" \
            --arg m "$MARKERS" \
            --arg t "$TAIL" \
            '{result:$r, controlUrl:$u, markers:($m|split("\n")|map(select(length>0))), tail:($t|split("\n")), finishedAt:(now|todate)}' \
            > infra/status/deploy-control.json
          git config user.name  "opus8-bot"
          git config user.email "opus8-bot@users.noreply.github.com"
          git add infra/status/deploy-control.json
          git commit -m "chore(ci): deploy-control status [skip ci]" || echo "no change"
          git pull --rebase --autostash || true
          git push || true
