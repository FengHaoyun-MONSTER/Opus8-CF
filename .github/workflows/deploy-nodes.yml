name: deploy-nodes

on:
  workflow_dispatch:
    inputs:
      target:
        description: Edge node to deploy
        required: true
        default: acc1-n1
        type: choice
        options:
          - acc1-n1
          - acc1-n2
          - acc2-n1
          - acc2-n2
          - all
      transport_mode:
        description: One-run transport mode override
        required: true
        default: canary
        type: choice
        options:
          - canary
          - strict
      operation:
        description: Maintenance is for an exact existing node; provision requires approved scope and an unregistered node
        required: true
        default: maintenance
        type: choice
        options:
          - maintenance
          - provision
permissions:
  contents: write

concurrency:
  group: deploy-nodes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - alias: acc1
            node_id: acc1-n1
            region: US
            deploy_suffix: -v2
          - alias: acc1
            node_id: acc1-n2
            region: EU
            deploy_suffix: ""
          - alias: acc2
            node_id: acc2-n1
            region: HK
            deploy_suffix: ""
          - alias: acc2
            node_id: acc2-n2
            region: SG
            deploy_suffix: ""
    env:
      CONTROL_ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ matrix.alias == 'acc1' && secrets.API_TOKEN || secrets.API_TOKEN_NUM1 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ matrix.alias == 'acc1' && secrets.ACCOUNT_ID || secrets.ACCOUNT_ID_NUM1 }}
      ROOT_DOMAIN: ${{ matrix.alias == 'acc1' && secrets.ROOT_DOMAIN || secrets.ROOT_DOMAIN_NUM1 }}
      NODE_ID: ${{ matrix.node_id }}
      NODE_ACCOUNT_ALIAS: ${{ matrix.alias }}
      NODE_REGION: ${{ matrix.region }}
      NODE_DEPLOY_SUFFIX: ${{ matrix.deploy_suffix }}
      NODE_DEPLOY_OPERATION: ${{ inputs.operation }}
      TRANSPORT_MIGRATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.transport_mode || '' }}
      SERVICES_IP: ${{ secrets.SERVICES_IP }}
      SOCKS_USER: ${{ secrets.SOCKS_USER }}
      SOCKS_PASSWORD: ${{ secrets.SOCKS_PASSWORD }}
      VPS_HOST: ${{ secrets.SERVICES_IP }}
      VPS_SSH_USER: ${{ secrets.SERVICES_USER }}
      VPS_SSH_PASSWORD: ${{ secrets.SERVICES_CODE }}
      VPS_SSH_PORT: ${{ secrets.SERVICES_SSH_PORT }}
      CLOUDFLARE_PROXY_PERMISSION_REF: ${{ secrets.CLOUDFLARE_PROXY_PERMISSION_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - run: npm i -g wrangler@4.115.0
      - name: Create just-in-time node enrollment
        if: inputs.target == 'all' || inputs.target == matrix.node_id
        run: |
          set -euo pipefail
          CONTROL_HOST="${CONTROL_ROOT_DOMAIN#https://}"
          CONTROL_HOST="${CONTROL_HOST#http://}"
          CONTROL_HOST="${CONTROL_HOST%%/*}"
          CONTROL_API="https://api.${CONTROL_HOST}"
          LOGIN_BODY=$(ADMIN_PASSWORD="$ADMIN_PASSWORD" node -e \
            'process.stdout.write(JSON.stringify({password:process.env.ADMIN_PASSWORD}))')
          ADMIN_TOKEN=$(curl -fsS --max-time 20 -X POST \
            "$CONTROL_API/api/admin/login" \
            -H 'content-type: application/json' --data "$LOGIN_BODY" \
            | jq -er '.token')
          echo "::add-mask::$ADMIN_TOKEN"
          REGISTERED_NODES=$(curl -fsS --max-time 20 \
            "$CONTROL_API/api/nodes" \
            -H "authorization: Bearer $ADMIN_TOKEN")
          ENROLL_BODY=$(REGISTERED_NODES="$REGISTERED_NODES" node <<'NODE'
          const response = JSON.parse(process.env.REGISTERED_NODES || "{}");
          const existing = (response.nodes || []).find(
            (node) => node.id === process.env.NODE_ID,
          );
          const root = String(process.env.ROOT_DOMAIN || "")
            .replace(/^https?:\/\//, "").split("/")[0].replace(/\.$/, "");
          const hostname = existing?.hostname ||
            `${process.env.NODE_ID}${process.env.NODE_DEPLOY_SUFFIX || ""}.${root}`;
          const body = {
            nodeId: process.env.NODE_ID,
            accountAlias: process.env.NODE_ACCOUNT_ALIAS,
            accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
            hostname,
            region: existing?.region || process.env.NODE_REGION || undefined,
            capabilities: existing ? JSON.parse(existing.capabilities || "[]") : undefined,
            preferredIp: existing?.preferred_ip || undefined,
            transportPath: existing?.transport_path || undefined,
            ttlSeconds: 3600,
          };
          process.stdout.write(JSON.stringify(body));
          NODE
          )
          ENROLLMENT=$(curl -fsS --max-time 20 -X POST \
            "$CONTROL_API/api/node-enrollments" \
            -H "authorization: Bearer $ADMIN_TOKEN" \
            -H 'content-type: application/json' --data "$ENROLL_BODY")
          NODE_ENROLLMENT_TOKEN=$(printf '%s' "$ENROLLMENT" | jq -er '.token')
          NODE_ENROLLMENT_ID=$(printf '%s' "$ENROLLMENT" | jq -er '.enrollment.id')
          echo "NODE_ENROLLMENT_ID=$NODE_ENROLLMENT_ID" >> "$GITHUB_ENV"
          NODE_ENROLLMENT_KIND=$(printf '%s' "$ENROLLMENT" | jq -er '.enrollment.kind')
          NODE_HOSTNAME=$(printf '%s' "$ENROLLMENT" | jq -er '.enrollment.hostname')
          NODE_TRANSPORT_PATH=$(printf '%s' "$ENROLLMENT" | jq -er '.enrollment.transportPath')
          if { [ "$NODE_DEPLOY_OPERATION" = "provision" ] \
            && [ "$NODE_ENROLLMENT_KIND" != "provision" ]; } \
            || { [ "$NODE_DEPLOY_OPERATION" = "maintenance" ] \
            && [ "$NODE_ENROLLMENT_KIND" != "migrate" ] \
            && [ "$NODE_ENROLLMENT_KIND" != "rotate" ]; }; then
            echo "ERROR enrollment-operation-mismatch kind=$NODE_ENROLLMENT_KIND operation=$NODE_DEPLOY_OPERATION"
            curl -sS --max-time 20 -X DELETE \
              "$CONTROL_API/api/node-enrollments/$NODE_ENROLLMENT_ID" \
              -H "authorization: Bearer $ADMIN_TOKEN" >/dev/null || true
            exit 9
          fi
          echo "::add-mask::$NODE_ENROLLMENT_TOKEN"
          {
            echo "NODE_ENROLLMENT_TOKEN=$NODE_ENROLLMENT_TOKEN"
            echo "NODE_HOSTNAME=$NODE_HOSTNAME"
            echo "NODE_TRANSPORT_PATH=$NODE_TRANSPORT_PATH"
          } >> "$GITHUB_ENV"
          echo "OK just-in-time-enrollment kind=$NODE_ENROLLMENT_KIND"
      - name: Deploy declared edge node
        id: deploy
        if: inputs.target == 'all' || inputs.target == matrix.node_id
        run: |
          set -o pipefail
          bash infra/scripts/deploy-node.sh 2>&1 | tee /tmp/dn.log

      - name: Revoke unused enrollment
        if: always() && (inputs.target == 'all' || inputs.target == matrix.node_id)
        run: |
          set -euo pipefail
          [ -n "${NODE_ENROLLMENT_ID:-}" ] || exit 0
          CONTROL_HOST="${CONTROL_ROOT_DOMAIN#https://}"
          CONTROL_HOST="${CONTROL_HOST#http://}"
          CONTROL_HOST="${CONTROL_HOST%%/*}"
          CONTROL_API="https://api.${CONTROL_HOST}"
          LOGIN_BODY=$(ADMIN_PASSWORD="$ADMIN_PASSWORD" node -e \
            'process.stdout.write(JSON.stringify({password:process.env.ADMIN_PASSWORD}))')
          ADMIN_TOKEN=$(curl -fsS --max-time 20 -X POST \
            "$CONTROL_API/api/admin/login" \
            -H 'content-type: application/json' --data "$LOGIN_BODY" \
            | jq -er '.token')
          echo "::add-mask::$ADMIN_TOKEN"
          curl -sS --max-time 20 -X DELETE \
            "$CONTROL_API/api/node-enrollments/$NODE_ENROLLMENT_ID" \
            -H "authorization: Bearer $ADMIN_TOKEN" >/dev/null || true

      - name: Publish status back to repo
        if: always() && (inputs.target == 'all' || inputs.target == matrix.node_id)
        run: |
          mkdir -p infra/status
          URL=$(grep '^DONE url=' /tmp/dn.log | tail -n1 | sed 's/^DONE url=//' || true)
          MARKERS=$(grep -E '^(STEP|OK|ERROR|INFO|DONE) ' /tmp/dn.log || true)
          jq -n --arg r "${{ steps.deploy.outcome }}" --arg u "$URL" --arg m "$MARKERS" --arg n "${{ matrix.node_id }}" \
            '{node:$n, result:$r, nodeUrl:$u, markers:($m|split("\n")|map(select(length>0))), finishedAt:(now|todate)}' \
            > "infra/status/deploy-node-${{ matrix.node_id }}.json"
          git config user.name  "opus8-bot"
          git config user.email "opus8-bot@users.noreply.github.com"
          git add "infra/status/deploy-node-${{ matrix.node_id }}.json"
          git commit -m "chore(ci): node ${{ matrix.node_id }} status [skip ci]" || echo "no change"
          for k in 1 2 3 4 5 6; do git pull --rebase --autostash && git push && break || sleep $((RANDOM % 5 + 2)); done
