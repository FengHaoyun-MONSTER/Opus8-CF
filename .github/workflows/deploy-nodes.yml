name: deploy-nodes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-nodes.yml'
      - 'infra/scripts/deploy-node.sh'
      - 'packages/edge-node/**'

permissions:
  contents: write

concurrency:
  group: deploy-nodes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - alias: acc1
            node_id: acc1-n1
            region: US
    env:
      CONTROL_PLANE_URL: https://opus8cf-control.techtoolhub-office.workers.dev
      NODE_HMAC_SECRET: ${{ secrets.NODE_HMAC_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ matrix.alias == 'acc1' && secrets.API_TOKEN || secrets.API_TOKEN_NUM1 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ matrix.alias == 'acc1' && secrets.ACCOUNT_ID || secrets.ACCOUNT_ID_NUM1 }}
      NODE_ID: ${{ matrix.node_id }}
      NODE_ACCOUNT_ALIAS: ${{ matrix.alias }}
      NODE_REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g wrangler@3
      - name: Deploy edge node
        id: deploy
        continue-on-error: true
        run: bash infra/scripts/deploy-node.sh 2>&1 | tee /tmp/dn.log

      - name: Publish status back to repo
        if: always()
        run: |
          mkdir -p infra/status
          URL=$(grep -oE 'https://[a-z0-9._-]+workers\.dev' /tmp/dn.log | head -n1 || true)
          MARKERS=$(grep -E '^(STEP|OK|ERROR|INFO|DONE) ' /tmp/dn.log || true)
          jq -n --arg r "${{ steps.deploy.outcome }}" --arg u "$URL" --arg m "$MARKERS" --arg n "${{ matrix.node_id }}" \
            '{node:$n, result:$r, nodeUrl:$u, markers:($m|split("\n")|map(select(length>0))), finishedAt:(now|todate)}' \
            > "infra/status/deploy-node-${{ matrix.node_id }}.json"
          git config user.name  "opus8-bot"
          git config user.email "opus8-bot@users.noreply.github.com"
          git add "infra/status/deploy-node-${{ matrix.node_id }}.json"
          git commit -m "chore(ci): node ${{ matrix.node_id }} status [skip ci]" || echo "no change"
          for k in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 3; done
