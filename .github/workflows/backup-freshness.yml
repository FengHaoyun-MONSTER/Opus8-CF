name: backup-freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: backup-freshness
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Reconcile encrypted backup freshness alert
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_MAX_AGE_HOURS: "26"
        run: node infra/scripts/backup-freshness.mjs
