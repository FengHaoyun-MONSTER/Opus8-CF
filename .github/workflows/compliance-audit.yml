name: compliance-audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: compliance-audit
  cancel-in-progress: false

jobs:
  cloudflare-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_ACCOUNT_ACC1: ${{ secrets.ACCOUNT_ID }}
      CF_TOKEN_ACC1: ${{ secrets.API_TOKEN }}
      CF_ACCOUNT_ACC2: ${{ secrets.ACCOUNT_ID_NUM1 }}
      CF_TOKEN_ACC2: ${{ secrets.API_TOKEN_NUM1 }}
    steps:
      - name: Checkout pinned repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Validate policy and query Cloudflare read-only analytics
        env:
          RESOURCE_AUDIT_OUTPUT: ${{ runner.temp }}/opus8-resource-audit.json
        run: node infra/scripts/cloudflare-resource-audit.mjs
