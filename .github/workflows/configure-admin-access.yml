name: configure-admin-access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-admin-access
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN_NUM1 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID_NUM1 }}
      ACCESS_ADMIN_EMAIL: ${{ secrets.ACCESS_ADMIN_EMAIL }}
      ACCESS_HOSTNAME: opus8cf-admin-openal.pages.dev
      CF_ZERO_TRUST_TEAM: ${{ secrets.CF_ZERO_TRUST_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Protect production Pages hostname
        run: bash infra/scripts/configure-admin-access.sh
      - name: Read latest Pages deployment hostname
        id: pages
        run: |
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/opus8cf-admin-openal")
          URL=$(jq -r '.result.canonical_deployment.url' <<< "$RESPONSE")
          test -n "$URL" && test "$URL" != "null"
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
      - name: Protect Pages preview hostnames
        env:
          ACCESS_HOSTNAME: '*.opus8cf-admin-openal.pages.dev'
          ACCESS_VERIFY_HOSTNAME: ${{ steps.pages.outputs.deployment_url }}
        run: bash infra/scripts/configure-admin-access.sh
